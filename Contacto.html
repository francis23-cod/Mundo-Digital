<!-- -----------------------------Formulario de Contacto------------------------- -->

    <form class="Formulario">
        <h2>Formulario de Contacto</h2>
        <legend>Informacion Personal:</legend>

        <label>Nombre</label><br>
            <input type="text" placeholder="Nombre" required minlength="4" class="content-input"><br>
        <label>Correo Electronico</label><br>
            <input type="email" placeholder="Correo Electronico" required class="content-input"><br>
        <label>Contraseña</label><br>
                <input type="password" placeholder="Contraseña" required minlength="5" class="content-input"><br>

        <legend>Cuentanos tu problema:</legend>
            <label class="mensaje">Deja tu mensaje para que nuestro equipo se ponga en contacto con usted</label><br>
                <textarea required placeholder="Deje su mensaje"></textarea><br>
                <input type="submit" placeholder="Enviar" class="Enviar">
            </form>

            <div class="shadow"></div>

        <style>
            body {
    margin: 0px;
    background-image: url(/imagenes/footer-img.png);
    font-family: Arial, Helvetica, sans-serif;
}


        /* ------------------------------------------------Seccion de Navegacion--------------------------------------------- */
.header {
    background-color: #dce0e6;
    display: flex;
    position: relative;
    width: 100%;
    height: 90px;
    z-index: 1;
}
.hea-list {
    display: inline-flex;
    margin-left: 45%;
}
.hea-item {
    list-style: none;
    margin: 5px;
    padding-top: 10px;
    transition: all, 0.4s;
}
.hea-item a {
    text-decoration: none;
    font-size: 15px;
    color: #1f1f20;
}


.hea-login{
    background-color: #567ebb;
    list-style: none;
    margin-right: 20px;
    padding: 15px;
    transition: all, 0.4s; 
    border-radius: 10px;
    border: solid #567ebb;
}
.hea-login a{
    text-decoration: none;
    margin-top: 5px;
    color: #dce0e6;
    font-weight: bolder;
}

.logo{
    position: relative;
    left: 30px;
    bottom: 100px;
    width: 300px;
}
        /* ------------------------------------------------Seccion del menu--------------------------------------------- */
.menu {
    margin-top: 10px;
    font-weight: bolder;
    padding: 10px;
    padding-top: 30px;
    transition: all, 0.5s;
    cursor: pointer;
    position: absolute;
}
.menu label{
        font-size: 30px;
}
#menu{
    position: absolute;
    display: none;
}
.menu-list {
    display: none;
    position: absolute;
    background-color: #dce0e6;
    border-right: #567ebb solid 1px;
    border-left: #567ebb solid 1px;
    width: 200px;
    height: 100vh;
    left: 5px;
    list-style: none;
    transition: all, 0.7s;
}
.menu-list li{
    margin: 3px;
    margin-top: 40px;
    padding: 10px;
}
.menu-list a{
    text-decoration: none;
    color: #606d80;
}


        /* ------------------------------------------------Seccion de Contacto--------------------------------------------- */

.Formulario{
    position: absolute;
    margin-top: 3%;
    margin-left: 25%;
    padding: 50px 100px;
    background-color: #dce0e6;
    border: #2b4c7e solid 1px;
    border-radius: 15px;
    color: #2b4c7e;
    transition: all, 0.5s;
}

.Formulario .content-input{
    margin: 5px;
    padding: 10px;
    width: 80%;
    border: #2b4c7e solid 1px;
    border-radius: 5px;
    cursor: pointer;
    transition: all,0.4s;
}

.Formulario h2{
    text-align: center;
}

.Enviar{
    width: 200px;
    height: 30px;
    margin-left: 25%;
    margin-top: 5%;
    border: #2b4c7e 1px solid;
    border-radius: 5px;
    transition: all,0.3s;
    cursor: pointer;
}

.Formulario legend{
    margin-top: 10px;
    margin-bottom: 10px;
    font-size: 20px;
    font-weight: bold;
}

.Formulario textarea{
    border: #2b4c7e solid 1px;
    margin-top: 10px;
    min-width: 500px;
    min-height: 100px;
    max-height: 100px;
    max-width: 500px;
    border-radius: 5px;
    transition: all,0.4s;
}
.mensaje{
    margin-top: 10px;
}

        /* ------------------------------------------------Seccion Visual de la web--------------------------------------------- */
.hea-item:hover{
    background-color: #dce0e6;
    border-radius: 5px;
    text-decoration: underline;
}

.hea-login:hover{
    background-color: #dce0e6;
}
.hea-login:hover a {
    color: #2b4c7e;
}


.menu:hover{
    background-color: rgb(230, 227, 227);
}
#menu:checked  + .menu-list{
    display: block;
}

.menu-list li a{
    transition: all, 0.5s;
}

.menu-list li:hover{
    background-color: #dce0e6;
    border-bottom-left-radius: 10px;
    border-top-left-radius: 10px;
}
.menu-list li:hover a{
    color: #2b4c7e;
}



.Formulario:hover{
    box-shadow: #305F8B 3px 3px 10px;
}
.Formulario .content-input:hover{
    padding: 15px;
}
.Formulario textarea:hover{
    padding: 10px;
}
.Enviar:hover{
    background-color: #567ebb;
    border: #dce0e6 1px solid;
    color: #dce0e6;
}

.Formulario{
    animation: Formulario ease-in-out 1s;
}

.shadow{
    width: 100%;
    height: 55vh;
    margin-top: 25%;
    background-image: linear-gradient(to bottom, transparent,#1f1f20);
}


         /* ------------------------------------------------Animaciones--------------------------------------------- */

@keyframes Formulario{
    from{
        margin-left: 0px;
        opacity: 20%;
    }
    to{
        opacity: 100%;
    }
}
        </style>
        </body>

</html>
